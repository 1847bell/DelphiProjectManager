name: Build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release draft tag, e.g. v1.0.0 (leave empty to build only)'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Windows x64 / .NET 10
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [xml]$project = Get-Content DelphiBuilder/DelphiBuilder.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag must match project version: v$version"
          }

      - name: Restore
        run: dotnet restore DelphiBuilder.slnx

      - name: Build
        run: dotnet build DelphiBuilder.slnx -c Release --no-restore -p:DebugType=None -p:DebugSymbols=false

      - name: Run regression tests
        run: dotnet test DelphiBuilder.Tests/DelphiBuilder.Tests.csproj -c Release --no-build --no-restore

      - name: Publish and package portable app
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'DelphiBuilder-win-x64'
          dotnet publish DelphiBuilder/DelphiBuilder.csproj -c Release --no-build --no-restore -p:PublishProfile=Portable -o "$publishDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$publishDir/LICENSE")) { throw 'Missing GPL license' }
          if (-not (Test-Path "$publishDir/THIRD-PARTY-NOTICES.txt")) { throw 'Missing third-party license notices' }
          $userData = Get-ChildItem $publishDir -Recurse -File | Where-Object {
            $_.Name -match '\.(db|sqlite3?)(-(wal|shm|journal))?$'
          }
          if ($userData) { throw 'User databases must not be included in the package' }
          $runtime = Get-Content "$publishDir/DelphiBuilder.runtimeconfig.json" -Raw | ConvertFrom-Json
          if ('Microsoft.WindowsDesktop.App' -notin $runtime.runtimeOptions.frameworks.name) {
            throw 'Expected a framework-dependent Windows Desktop application'
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$publishDir/*" -DestinationPath artifacts/DelphiBuilder-win-x64.zip -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DelphiBuilder-win-x64
          path: artifacts/DelphiBuilder-win-x64.zip
          if-no-files-found: error

  draft-release:
    name: Create or update release draft
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download portable ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DelphiBuilder-win-x64
          path: artifacts

      - name: Save release as draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $title = "Delphi 项目管理器 $env:RELEASE_TAG"
          $release = gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($release | ConvertFrom-Json).isDraft) {
              throw 'Refusing to modify an already published release'
            }
            gh release edit "$env:RELEASE_TAG" --draft=true --title "$title" --notes-file .github/release-notes.md --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload "$env:RELEASE_TAG" artifacts/DelphiBuilder-win-x64.zip --clobber
          } else {
            gh release create "$env:RELEASE_TAG" artifacts/DelphiBuilder-win-x64.zip --draft --title "$title" --notes-file .github/release-notes.md --target "$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
